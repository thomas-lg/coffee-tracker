# Keeps the ecosystems this repo ships patched: NuGet (backend), npm (frontend
# workspaces), Docker base images (prod + devcontainer), devcontainer features,
# and the Actions used in these workflows. Weekly, grouped minor+patch to keep
# PR noise down. Targets the default branch (main); `deps` prefix feeds the conventional
# PR-title check + label workflows.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/" # CoffeeTracker.sln lives at the repo root
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # One PR for everything, not one per package. Every NuGet bump that touches
    # Application or Infrastructure invalidates the packages.lock.json of Api and
    # Tests too, and Dependabot only refreshes the lock file of the project whose
    # .csproj it edited — so each PR needs a manual `--force-evaluate` pass (see
    # scripts/refresh-lockfiles.ps1). Grouping makes that chore weekly, not per-package.
    # Majors stay in their own group so they remain reviewable on their own merits
    # instead of being buried in a 13-package diff.
    groups:
      dotnet-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      dotnet-major:
        patterns: ["*"]
        update-types: [major]
    # Two majors are permanently out of reach, so don't re-raise them weekly. Both were
    # tried and closed with the build output on the PR; revisit only if the cause changes.
    ignore:
      # 4.x demands a paid Six Labors license key at build time:
      # "No Six Labors license found. Set $(SixLaborsLicenseKey) ..."
      - dependency-name: SixLabors.ImageSharp
        update-types: [version-update:semver-major]
      # 3.x makes IOpenApiMediaType.Example read-only, which the
      # Microsoft.AspNetCore.OpenApi source generator still assigns to (CS0200).
      # Unblocked only by an ASP.NET Core release built against OpenApi 3.x.
      - dependency-name: Microsoft.OpenApi
        update-types: [version-update:semver-major]
    labels: [dependencies, dotnet]
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # Angular pins TypeScript to a narrow peer range -- @angular/build 22 wants
    # ">=6.0 <6.1", so anything past a 6.0.x patch fails `npm ci` with ERESOLVE.
    # TypeScript here is driven by Angular: bump it deliberately with an Angular
    # major, not on its own. Patches still flow.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    labels: [dependencies, frontend]
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directory: "/" # production Dockerfile + docker-compose.yml
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directory: "/.devcontainer"
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    commit-message:
      prefix: deps

  # The docker ecosystem above only covers the devcontainer's base image; this one
  # updates the features pinned in devcontainer.json / devcontainer-lock.json.
  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, github-actions]
    commit-message:
      prefix: deps
