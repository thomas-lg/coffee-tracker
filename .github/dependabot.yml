# Keeps the ecosystems this repo ships patched: NuGet (backend), npm (frontend
# workspaces), Docker base images (prod + devcontainer), devcontainer features,
# and the Actions used in these workflows. Weekly, grouped minor+patch to keep
# PR noise down. Targets the default branch (main); `deps` prefix feeds the conventional
# PR-title check + label workflows.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/" # CoffeeTracker.sln lives at the repo root
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # One PR for everything, not one per package. Every NuGet bump that touches
    # Application or Infrastructure invalidates the packages.lock.json of Api and
    # Tests too, and Dependabot only refreshes the lock file of the project whose
    # .csproj it edited — so each PR needs a manual `--force-evaluate` pass (see
    # scripts/refresh-lockfiles.ps1). Grouping makes that chore weekly, not per-package.
    # Majors stay in their own group so they remain reviewable on their own merits
    # instead of being buried in a 13-package diff.
    groups:
      dotnet-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      dotnet-major:
        patterns: ["*"]
        update-types: [major]
    labels: [dependencies, dotnet]
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, frontend]
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directory: "/" # production Dockerfile + docker-compose.yml
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directory: "/.devcontainer"
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    commit-message:
      prefix: deps

  # The docker ecosystem above only covers the devcontainer's base image; this one
  # updates the features pinned in devcontainer.json / devcontainer-lock.json.
  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, github-actions]
    commit-message:
      prefix: deps
