name: Refresh lock files

# Regenerates the backend packages.lock.json files on a pull request and pushes the
# result back to its branch. Exists because Dependabot only refreshes the lock file of
# the project whose .csproj it edited, so any bump touching Application or Infrastructure
# leaves Api/Tests stale and ci.yml's `dotnet restore --locked-mode` fails with NU1004.
# Same job as scripts/refresh-lockfiles.ps1, but it doesn't need an SDK on anyone's laptop.
#
# Two constraints shaped this into a manually-dispatched workflow rather than an automatic
# fix-up on `pull_request`:
#
#   1. Workflow runs triggered *by Dependabot* get a read-only GITHUB_TOKEN and no access
#      to secrets, so a `pull_request`-triggered job could never push the fix.
#      workflow_dispatch runs in the base-branch context, with a writable token.
#   2. This workflow CANNOT make the required checks pass on its own, and doesn't pretend
#      to. Any run whose triggering actor is github-actions[bot] is parked as
#      `action_required` — GitHub's protection against workflows re-triggering
#      themselves — and nothing the bot can do lifts it for its own runs: not pushing,
#      not closing/reopening the PR, not the approve API. Only a non-bot actor can.
#      (Established against PR #100: a bot push left CI parked; the same close/reopen
#      done by a user token started it immediately.) So the last step does the part that
#      works and then states plainly what is left — one command from any machine with a
#      user token, no local .NET toolchain required. Granting a PAT or GitHub App token
#      here would close the loop automatically; that is a secret-management decision for
#      the repo owner, not something to assume.
#
# Usage: gh workflow run refresh-lockfiles.yml -f pr=<number>

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number whose lock files should be refreshed"
        required: true
        type: string

# Unlike ci.yml (which stays contents: read), this workflow exists to commit.
permissions:
  contents: write
  pull-requests: write
  actions: read # list check runs, to report whether they're parked as action_required

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the PR's head branch by name (not the merge ref) so the refreshed
          # lock files can be pushed straight back to it.
          ref: refs/pull/${{ inputs.pr }}/head
          # A detached merge ref can't be pushed; resolve the real branch below.
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Resolve the PR's head branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(gh pr view "${{ inputs.pr }}" --json headRefName -q .headRefName)
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Refreshing lock files on $branch"

      # --force-evaluate re-resolves every project graph and rewrites every lock file,
      # which is exactly what --locked-mode in ci.yml then verifies.
      - name: Restore with --force-evaluate
        run: dotnet restore CoffeeTracker.sln --force-evaluate

      # A changed .csproj would mean the restore resolved something the bump didn't
      # intend, so refuse rather than commit it. Mirrors scripts/refresh-lockfiles.ps1.
      - name: Reject changes outside the lock files
        run: |
          unexpected=$(git status --porcelain | awk '{print $2}' \
            | grep -v -E '^backend/[^/]+/packages\.lock\.json$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Restore changed files other than the lock files:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit and push
        id: commit
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          if git diff --quiet -- 'backend/*/packages.lock.json'; then
            echo "Lock files already consistent; nothing to push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/*/packages.lock.json
          # Two -m flags rather than one multi-line string: a YAML block scalar would
          # carry this step's indentation into the commit message body.
          git commit             -m "deps: refresh packages.lock.json after the NuGet bump"             -m "Dependabot updates only the lock file of the project it edited; Api and Tests reference Application/Infrastructure transitively and go stale, which fails ci.yml's restore --locked-mode with NU1004."
          git push origin "HEAD:$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Satisfy main's strict up-to-date rule, then report what a human still has to do.
      # Non-fatal: update-branch legitimately no-ops when the branch is already current.
      - name: Update the branch and report what remains
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          REPO: ${{ github.repository }}
        run: |
          gh pr update-branch "$PR" || true

          parked=$(gh run list --branch "$BRANCH" --limit 20             --json databaseId,conclusion             -q '[.[] | select(.conclusion == "action_required")] | length')

          {
            echo "### Lock files refreshed on \`$BRANCH\`"
            echo
            if [ "${parked:-0}" -gt 0 ]; then
              echo "The required checks are parked as \`action_required\` because the fix was"
              echo "pushed by \`github-actions[bot]\`. GITHUB_TOKEN cannot start or approve its"
              echo "own runs, so finish it with a user token:"
              echo
              echo '```bash'
              echo "gh pr close $PR && gh pr reopen $PR"
              echo '```'
            else
              echo "Required checks are running on the refreshed head; nothing further to do."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${parked:-0}" -gt 0 ]; then
            echo "::warning::Lock files pushed, but $parked check run(s) are parked as action_required. Run: gh pr close $PR && gh pr reopen $PR"
          fi
