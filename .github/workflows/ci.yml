name: CI

# Runs on every PR and on pushes to main and beta. Validates backend + frontend + the
# production Docker build. It does NOT push images; release.yml does that, and it gates
# every branch publish on this workflow succeeding.
on:
  pull_request:
  push:
    branches: [main, beta]

# Least privilege: these jobs only read the repo (no image push here).
permissions:
  contents: read

# A newer push to the same PR (or to main) cancels the in-flight run. The Docker
# build job is the expensive one to waste. Keyed by ref, so each PR and main are
# independent groups; ci.yml never publishes, so cancelling a main run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # Cache the global NuGet package store, keyed on the committed lock files so the
      # key changes exactly when a resolved dependency changes.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      # Native OCR deps so the Tesseract-backed tests can run on the runner.
      # Mirror the dev/prod package set; TESSDATA_PREFIX is the PARENT of tessdata.
      # Both engines, because the benchmark scores whichever one ships as the default
      # and a number measured against an engine nobody runs is worth nothing.
      - name: Install the OCR engines
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng libtesseract-dev libleptonica-dev \
            libgl1 libglib2.0-0
          # The same pinned file the image installs, so CI scores the engine that ships.
          pip install --no-cache-dir -r deploy/rapidocr/requirements.txt
          # Both go, then only the headless wheel comes back: the two share the `cv2`
          # directory, so removing one takes it away and pip skips reinstalling the
          # other as already present. Re-running the whole file would also let pip
          # satisfy rapidocr's dependency and bring the GUI build back.
          pip uninstall -y opencv-python opencv-python-headless
          pip install --no-cache-dir "$(grep '^opencv-python-headless' deploy/rapidocr/requirements.txt)"
          # Fetch the models now, so the benchmark's first fixture is not also a download.
          python3 -c "from rapidocr import RapidOCR; RapidOCR()"
      # --locked-mode fails the restore if packages.lock.json is out of date, so a
      # dependency bump can't sneak in without an updated, reviewed lock file.
      - run: dotnet restore CoffeeTracker.sln --locked-mode
      - run: dotnet build CoffeeTracker.sln --no-restore --configuration Release
      - name: Test
        env:
          TESSDATA_PREFIX: /usr/share/tesseract-ocr/5
        run: dotnet test CoffeeTracker.sln --no-build --configuration Release --verbosity normal
      # The OCR benchmark runs as part of the suite above (this job already installs
      # Tesseract) and writes its scorecard beside the test assembly. Surfacing it here
      # is what makes a score change reviewable: the number moves in the run summary of
      # the PR that moved it, instead of inside collapsed log output nobody expands.
      # It runs even after a failed test step, because a run that fell under the floor
      # is exactly the one worth reading.
      - name: OCR benchmark scorecard
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          cards=(backend/CoffeeTracker.Tests/bin/Release/net10.0/ocr-benchmark-*.md)
          if [ ${#cards[@]} -eq 0 ]; then
            echo "OCR benchmark did not run (no scorecard produced)." >> "$GITHUB_STEP_SUMMARY"
          else
            # One per engine. Both are published because every parser constant is shared
            # between them, so a change that helps one can cost the other.
            for card in "${cards[@]}"; do
              cat "$card" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            done
          fi

  frontend:
    runs-on: ubuntu-latest
    # This job builds + unit-tests only; @playwright/test's browser download is the
    # e2e job's concern, so skip it here to keep npm ci fast.
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint --if-present
      # The production build is the comprehensive compile gate: it type-checks and
      # bundles the app + every library (via the source path aliases).
      - name: Build (production)
        working-directory: frontend
        run: npx ng build app --configuration production
      # Unit tests via the vitest builder (NOT Karma, so no --browsers). `npm test`
      # runs the workspace-wide `tests` project, which covers every package's specs in
      # one build, so a laptop runs exactly what CI runs. This used to be seven
      # hand-listed commands here, while a bare `ng test` locally covered only the
      # default project and hid 16 of the 19 spec files.
      - name: Unit tests (vitest)
        working-directory: frontend
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Start the API on :5000 in the background against a database that does not exist
      # yet, so the instance opens registration for its first account. The e2e global
      # setup claims it (becoming admin) and reopens registration for the rest of the
      # suite. Development also disables OCR (no Tesseract needed). The Angular dev
      # server that Playwright starts proxies /api here.
      - name: Start backend API
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: dotnet run --project backend/CoffeeTracker.Api --urls http://localhost:5000 &
      # Poll the liveness endpoint the container's HEALTHCHECK also uses. It is mapped
      # anonymously (outside the global auth fallback policy), so no token is needed.
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5000/health >/dev/null 2>&1; then
              echo "API ready"; exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time"; exit 1
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      # Drift guard: re-derive the OpenAPI doc + typed client from the running backend
      # and fail if they differ from what's committed, so a backend contract change that
      # wasn't regenerated can't ship a stale frontend client that only breaks at runtime.
      - name: Check generated API client is up to date
        working-directory: frontend
        run: |
          curl -fsS http://localhost:5000/openapi/v1.json -o openapi.json
          npm run gen:api
          git diff --exit-code -- openapi.json packages/data/src/lib/models/api-types.ts \
            || { echo "::error::OpenAPI client is stale, run 'npm run gen:api' and commit the result."; exit 1; }
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # Playwright starts the Angular dev server (ng serve on :4200) via webServer.
      - name: Run Playwright e2e
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # The image ships for arm64 too, so a PR that breaks that build has to fail here rather
  # than at release. Its own job on a native arm64 runner, not a second step on the amd64
  # one: built under QEMU it took 366 seconds against 116 for amd64, three quarters of the
  # whole job, and emulating a pip install of onnxruntime and numpy is most of that. Free
  # for public repositories. It is also not scanned, because both images install the same
  # packages from the same base and scanning one covers the CVEs of both.
  docker-build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Verify the arm64 image builds
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          # A separate cache scope: sharing one with the amd64 job would have each
          # eviction take the other's layers with it.
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  docker-build:
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE the top-level set, so re-state contents: read
    # alongside the security-events: write needed to upload the Trivy scan.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Build amd64 and load it into the local daemon so Trivy scans the exact image.
      # Only one platform can be loaded, which is why the arm64 build is a separate step
      # below rather than a second entry here.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: coffee-tracker:ci
          # Persist the layer cache between runs. Both restore layers (npm in stage 1,
          # NuGet in stage 2) are keyed on manifests, so a PR that only touches source
          # code reuses them instead of re-downloading both dependency graphs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Report CRITICAL+HIGH CVEs to the Security tab (SARIF), non-blocking: base-image
      # HIGHs come and go with Trivy's vuln DB and are outside our control, so they must
      # not flake PRs. The hard gate below blocks only on a fixable CRITICAL.
      - name: Scan image for vulnerabilities (Trivy, report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: coffee-tracker:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload Trivy results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
      # Hard gate: fail only on a FIXABLE CRITICAL vulnerability (vuln scanner only, so a
      # false-positive secret match can't block). Reuses the Trivy DB cached above.
      - name: Fail on fixable CRITICAL vulnerabilities (Trivy, gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: coffee-tracker:ci
          scanners: vuln
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
