name: Release

# Builds and pushes the production image to GHCR. Publishing from a branch is gated
# on CI: this runs via workflow_run when the CI workflow succeeds on `main`
# (=> :latest + :sha-<short>) or on `beta` (=> :beta + :sha-<short>). Version tags v*
# still trigger directly (=> semver tags), they're cut from main commits that already
# passed CI, and the Trivy gate below scans the image again before it's pushed.
#
# The `beta` channel exists so a change can be run on real hardware without ever being
# offered to anything tracking :latest. Point a container at :beta to opt in; nothing
# else sees it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, beta]
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write # mint the OIDC token for the build-provenance attestation
  attestations: write # record the attestation against the pushed image

# Serialize publishes per channel so rapid pushes can't race on a moving tag. Keyed on
# the triggering branch, not github.ref: on a workflow_run event that is the default
# branch whatever built, so main and beta would otherwise share one queue. No
# cancel-in-progress: killing a run mid-push could leave a tag without its attestation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/thomas-lg/coffee-tracker

jobs:
  image:
    runs-on: ubuntu-latest
    # Branches: only publish when the gating CI run succeeded. On main, additionally
    # require that its commit is still the tip (a superseding push gets its own CI run
    # and release, so a stale run publishing an old sha would only churn :latest).
    # github.sha is the default branch's head on a workflow_run event, which is exactly
    # what that comparison needs and why it cannot be applied to beta. Tags: publish.
    #
    # The event/repository pair is load-bearing, not belt-and-braces: ci.yml runs on
    # pull_request, so it runs for fork PRs too, and `head_branch` is then the branch name
    # *inside the fork*, anyone naming theirs `beta` would otherwise have their unmerged
    # head published. `event == 'push'` is the strong half.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_repository.full_name == github.repository
        && (github.event.workflow_run.head_branch == 'beta'
            || github.event.workflow_run.head_sha == github.sha))
      || startsWith(github.ref, 'refs/tags/v')
    steps:
      # On a workflow_run event GITHUB_SHA and GITHUB_REF point at the DEFAULT branch,
      # not at the branch whose CI just passed. Checking out the default would build
      # main's code and publish it under :beta, so take the head sha explicitly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docker/metadata-action derives type=sha from the git context, which on a
      # workflow_run event is the DEFAULT branch, so it cannot be trusted to describe
      # what was actually checked out. Resolve the commit once here and build the tag
      # from it.
      - id: ctx
        name: Resolve the commit being built
        run: |
          SHA='${{ github.event.workflow_run.head_sha || github.sha }}'
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          # The channel is read from the triggering run's branch, never from
          # is_default_branch: on a workflow_run event that flag describes the default
          # branch regardless of what actually built.
          #
          # The sha tag is raw, not type=sha: type=sha has no `value` attribute, so
          # passing one is silently ignored and the tag is computed from the git
          # context, which would label a beta image with the default branch's sha and
          # overwrite the identically-named tag main had already published. priority
          # keeps it below the channel tags so outputs.version stays the channel, which
          # is what the Trivy step scans.
          tags: |
            type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == 'main' }}
            type=raw,value=beta,enable=${{ github.event.workflow_run.head_branch == 'beta' }}
            type=raw,value=sha-${{ steps.ctx.outputs.short_sha }},priority=100
            type=semver,pattern={{version}}
          # Same root cause as the sha tag: metadata-action derives the revision label
          # from the git context, which on a workflow_run event is the default branch.
          # An image that says it was built from a commit it does not contain defeats
          # the point of the label, so state it from the commit actually checked out.
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
      # Build first WITHOUT pushing so Trivy can gate on the exact image; the push
      # step below reuses the warm buildx cache, so it doesn't rebuild.
      #
      # amd64 only here because `load` can only take one platform. Both images install
      # the same packages from the same base, so scanning one covers the CVEs of the
      # manifest the push step publishes.
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Block the release only on a fixable CRITICAL CVE (vuln scanner only). HIGHs are
      # reported on PRs (ci.yml) but don't block: base-image HIGHs churn with the vuln DB
      # and are outside our control, so they shouldn't wedge a release.
      - name: Scan release image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          scanners: vuln
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
      # Publishes a manifest list, so `docker pull` resolves the right image on an
      # x86 NAS and on an ARM one (Raspberry Pi, ARM-based NAS) alike.
      - id: build
        name: Push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Signed proof of where/how the image was built, verifiable with
      # `gh attestation verify oci://ghcr.io/thomas-lg/coffee-tracker:<tag>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
