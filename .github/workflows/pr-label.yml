# Automatically applies a label to a PR based on its conventional commit prefix (e.g. feat: → feature).
# Type→label mapping is defined in .github/conventional-commit-types.json (shared with the title-check workflow).
name: Label PR from Conventional Commit

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read
  # Labels are an issues resource: writing one onto a PR needs pull-requests, creating a
  # missing one needs issues.
  issues: write
  pull-requests: write

jobs:
  apply-label:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read conventional commit types config
        id: type-config
        run: |
          if [ ! -f .github/conventional-commit-types.json ]; then
            echo "::error::Missing .github/conventional-commit-types.json" && exit 1
          fi
          jq -c . .github/conventional-commit-types.json > /dev/null \
            || { echo "::error::.github/conventional-commit-types.json is not valid JSON" && exit 1; }
          echo "types=$(jq -c . .github/conventional-commit-types.json)" >> "$GITHUB_OUTPUT"

      # Blocking on purpose: an unlabelled PR is a defect this workflow exists to prevent,
      # so it fails loudly rather than leaving a silent gap.
      - name: Apply label from PR title prefix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
          TYPES: ${{ steps.type-config.outputs.types }}
        run: |
          set -euo pipefail
          # feat(web)!: subject -> feat
          type="${TITLE%%[(!:]*}"
          label=$(jq -r --arg t "$type" '.[$t] // empty' <<< "$TYPES")
          if [ -z "$label" ]; then
            echo "::error::No label mapped for type '$type'. Add it to .github/conventional-commit-types.json."
            exit 1
          fi

          # The map carries more types than the repo has labels, so create on first use —
          # otherwise every PR of an unused type would go unlabelled.
          if ! gh label list --limit 200 --json name --jq '.[].name' | grep -qxF "$label"; then
            echo "Creating missing label '$label'."
            gh label create "$label" --color ededed --description "Conventional commit type: $type"
          fi

          gh pr edit "$NUMBER" --add-label "$label"
          echo "Applied '$label' (from type '$type')."
