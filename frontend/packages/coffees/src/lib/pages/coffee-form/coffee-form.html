<div class="mx-auto max-w-xl px-5 py-8">
  <a routerLink="/coffees" class="text-sm font-semibold text-muted hover:text-ink">← Back to shelf</a>
  <h1 class="mt-2 font-display text-3xl font-semibold">
    {{ editing() ? 'Edit coffee' : 'Add a coffee' }}
  </h1>

  <!-- Snap-to-fill -->
  @if (!editing()) {
    <label
      class="mt-5 flex cursor-pointer items-center gap-3 rounded-2xl border border-dashed border-crema bg-crema/10 p-4 transition hover:bg-crema/15"
    >
      <span class="grid size-11 place-items-center rounded-xl bg-crema text-ink"><svg lucideCamera [size]="22"></svg></span>
      <span class="flex-1">
        <span class="block font-semibold">{{ store.scanning() ? 'Reading the label…' : 'Snap the bag' }}</span>
        <span class="block text-xs text-muted">Photograph the bag and we’ll pre-fill the form.</span>
      </span>
      <input type="file" accept="image/*" capture="environment" class="hidden" (change)="onSnap($event)" />
    </label>
  }

  @if (editing() && store.loading()) {
    <div class="mt-5 flex flex-col gap-4" aria-busy="true">
      @for (s of [1, 2, 3, 4, 5]; track s) {
        <ct-skeleton height="3.25rem" width="100%" />
      }
    </div>
  } @else {
    <form [formRoot]="f" (submit)="$event.preventDefault(); onSubmit()" class="mt-5 flex flex-col gap-4">
      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-semibold">Name</span>
        <input [formField]="f.name" [attr.aria-invalid]="f.name().touched() && f.name().invalid() ? 'true' : null" [attr.aria-describedby]="f.name().touched() && f.name().invalid() ? 'coffee-name-error' : null" class="input" />
        @if (f.name().touched() && f.name().invalid()) {
          <span id="coffee-name-error" class="field-error">A name is required.</span>
        }
      </label>

      <div class="grid grid-cols-2 gap-3">
        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-semibold">Roaster</span>
          <input [formField]="f.roaster" [attr.aria-invalid]="f.roaster().touched() && f.roaster().invalid() ? 'true' : null" [attr.aria-describedby]="f.roaster().touched() && f.roaster().invalid() ? 'coffee-roaster-error' : null" class="input" list="roasterOptions" autocomplete="off" />
          <datalist id="roasterOptions">
            @for (r of catalog.roasters(); track r) {
              <option [value]="r"></option>
            }
          </datalist>
          @if (f.roaster().touched() && f.roaster().invalid()) {
            <span id="coffee-roaster-error" class="field-error">A roaster is required.</span>
          }
        </label>
        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-semibold">Origin</span>
          <input [formField]="f.origin" [attr.aria-invalid]="f.origin().touched() && f.origin().invalid() ? 'true' : null" [attr.aria-describedby]="f.origin().touched() && f.origin().invalid() ? 'coffee-origin-error' : null" class="input" list="originOptions" autocomplete="off" />
          <datalist id="originOptions">
            @for (o of originSuggestions(); track o) {
              <option [value]="o"></option>
            }
          </datalist>
          @if (f.origin().touched() && f.origin().invalid()) {
            <span id="coffee-origin-error" class="field-error">An origin is required.</span>
          }
        </label>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-semibold">Roast level</span>
          <select [formField]="f.roastLevel" [attr.aria-invalid]="f.roastLevel().touched() && f.roastLevel().invalid() ? 'true' : null" [attr.aria-describedby]="f.roastLevel().touched() && f.roastLevel().invalid() ? 'coffee-roastlevel-error' : null" class="input">
            <option value="" disabled>Choose a roast…</option>
            @for (r of roastLevels; track r) {
              <option [value]="r">{{ r }}</option>
            }
          </select>
          @if (f.roastLevel().touched() && f.roastLevel().invalid()) {
            <span id="coffee-roastlevel-error" class="field-error">Pick a roast level.</span>
          }
        </label>
        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-semibold">Price</span>
          <input type="number" step="0.01" [formField]="f.price" [attr.aria-invalid]="f.price().touched() && f.price().invalid() ? 'true' : null" [attr.aria-describedby]="f.price().touched() && f.price().invalid() ? 'coffee-price-error' : null" class="input" />
          @if (f.price().touched() && f.price().invalid()) {
            <span id="coffee-price-error" class="field-error">Price can't be negative.</span>
          }
        </label>
      </div>

      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-semibold">Date bought</span>
        <input type="date" [formField]="f.dateBought" [attr.aria-invalid]="f.dateBought().touched() && f.dateBought().invalid() ? 'true' : null" [attr.aria-describedby]="f.dateBought().touched() && f.dateBought().invalid() ? 'coffee-datebought-error' : null" [max]="today()" class="input" />
        @if (f.dateBought().touched() && f.dateBought().invalid()) {
          <span id="coffee-datebought-error" class="field-error">Pick a date that isn't in the future.</span>
        }
      </label>

      <div class="grid grid-cols-2 gap-3">
        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-semibold">Shop <span class="text-muted">(optional)</span></span>
          <input [formField]="f.shopName" class="input" list="shopOptions" autocomplete="off" />
          <datalist id="shopOptions">
            @for (s of catalog.shops(); track s) {
              <option [value]="s"></option>
            }
          </datalist>
        </label>
        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-semibold">Link <span class="text-muted">(optional)</span></span>
          <input type="url" [formField]="f.purchaseUrl" class="input" />
        </label>
      </div>

      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-semibold">Photo <span class="text-muted">(optional)</span></span>
        <input type="file" accept="image/*" (change)="onPhotoSelected($event)" class="text-sm" />
      </label>

      @if (photoPreview(); as preview) {
        <!-- The thumbnail is cropped (object-cover), so make it openable: reading the
             label off a bag needs the whole frame. -->
        <button
          type="button"
          class="block w-full cursor-zoom-in overflow-hidden rounded-xl focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-crema"
          aria-label="View photo full size"
          (click)="lightbox.open()"
        >
          <img [src]="preview" alt="Selected coffee" class="h-40 w-full object-cover" />
        </button>
        <ct-image-lightbox #lightbox [src]="preview" alt="Selected coffee" />
      }

      <!-- Stays enabled while invalid: submitting then marks every field touched so
           the validation messages explain what's missing. -->
      <ct-button type="submit" [disabled]="store.submitting()" class="mt-2">
        {{ store.submitting() ? 'Saving…' : editing() ? 'Save changes' : 'Add coffee' }}
      </ct-button>
    </form>
  }
</div>
